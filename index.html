<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>Vite App</title>
</head>

<body>
    <div id="loginPopup" class="fixed inset-0 bg-amber-600 flex justify-center items-center z-50">
        <div class="flex flex-row gap-15 w-full max-w-4xl mx-auto p-8">

            <div class="w-1/2 text-white p-8">
                <div class="mb-12">
                    <span class="text-6xl">*</span>
                </div>
                <h1 class="text-6xl font-bold mb-4">Bonjour! 👋</h1>
                <p class="text-xl opacity-80">Bienvenue dans votre application de chat!</p>
                <div class="mt-auto pt-20">
                    <p class="text-sm opacity-60">© 2025 khouss Ngom. All rights reserved.</p>
                </div>
            </div>


            <div class="w-1/2 bg-white rounded-2xl shadow-2xl p-8">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold mb-2">Marakhib Chat</h2>
                    <h3 class="text-3xl font-bold mb-2">Welcome Back!</h3>
                </div>

                <form id="loginForm" class="flex flex-col gap-6">
                    <div class="flex flex-col gap-2">
                        <input  id="username"
                            class="w-full px-4 py-3 border-b-2 border-gray-200 focus:border-indigo-600 focus:outline-none" 
                            placeholder="login">
                    </div>

                    <div class="flex flex-col gap-2">
                        <input type="password" id="password" 
                            class="w-full px-4 py-3 border-b-2 border-gray-200 focus:border-indigo-600 focus:outline-none" 
                            placeholder="Password">
                    </div>

                    <button type="submit" 
                        class="w-full bg-black text-white py-4 rounded-lg font-medium hover:bg-gray-800 transition-colors">
                        Connectez vous maintenant
                    </button>

                </form>
            </div>
        </div>
    </div>

    <div class="flex flex-row w-full h-screen justify-center items-center">

        <div id="option" class="option flex flex-col gap-4 w-1/12 h-full justify-center items-center bg-[#f0f0e8]">

            <div id="Messages" class="boxIc flex flex-col w-[80px] h-[70px] justify-center items-center border-solid border-2 border-amber-500 hover:bg-amber-500 rounded-2xl">
                <i class='bx  bxs-message'></i>
                <small>Messages</small>
            </div>

            <div id="Groupe" class="boxIc flex flex-col w-[80px] h-[70px] justify-center items-center border-solid border-2 border-amber-500   hover:bg-amber-500 rounded-2xl">
                <i class='bx  bxs-group'></i>
                <small>Groupe</small>
            </div>

            <div id="diffusions" class="boxIc flex flex-col w-[80px] h-[70px] justify-center items-center border-solid border-2 border-amber-500 hover:bg-amber-500 rounded-2xl">
                <i class="fa-solid fa-arrows-turn-to-dots"></i>
                <small>Diffusions</small>
            </div>

            <div id="ARCHIVE" class="boxIc flex flex-col w-[80px] h-[70px] justify-center items-center border-solid border-2 border-amber-500 hover:bg-amber-500 rounded-2xl">
                <i class='bx  bxs-archive-alt'></i>
                <small>Archives</small>
            </div>

            <div id="nouveau" class="boxIc flex flex-col w-[80px] h-[70px] justify-center items-center border-solid border-2 border-amber-500 hover:bg-amber-500 rounded-2xl">
                <i class='bx  bxs-plus'></i>
                <small>Nouveau</small>
            </div>

            <div class="border-t border-gray-200 my-2"></div>

            <div class="option">
                <button id="logoutBtn" class="w-[95%] flex items-center gap-1 px-2 py-2 rounded-xl bg-amber-300 hover:bg-amber-600 text-[14px] text-black">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Déconnexion</span>
                </button>
            </div>
        </div>

        <div id="messages" class="messages flex flex-col  p-3 w-4/12 h-full justify-start items-start">

            <div class="flex flex-col w-full h-1/12 p-3 justify-start items-start">

                <div>Discussions</div>

                <div class="w-full h-[2px] bg-gray-100 "></div>

                <div class="w-full h-[25px] my-1">
                    <input id="recherche" placeholder="Rechercher" class=" bg-white h-full w-full pl-4 py-2 text-l border-2 rounded-xl">
                </div>

            </div>

            <div id="listMessage" class="flex flex-1 flex-col gap-3 w-full  justify-start items-start">

            </div>

        </div>

        <div id="mess" class="messages flex flex-col bg-[#efe7d7] w-7/12 h-full justify-start items-center mx-1">

            <div id="entetDiscussion" class="flex flex-col w-full h-2/12 border-b-2 border-white">
                <div class="flex flex-row w-full h-full border-b-2 ">

                    <div class="flex flex-row justify-start items-center w-[70%] h-full">
                        <div id="pp" class="flex justify-center items-center rounded-full bg-gray-700 w-[40px] h-[40px]  m-3"></div>
                        <div id="amis" class="flex flex-row justify-between items-start">
                            <div id="nomActive" class="text-xl text-center ">Khouss ngom</div>
                        </div>
                    </div>

                    <div id="action" class="flex flex-row mt-4">
                        <div class="flex gap-5 mr-3">
                            <span class="h-10 w-10 border rounded-full border-[#e86709] flex justify-center items-center">
                                <i class="bx  bxs-backspace  text-xl text-[#e86709]"  ></i> 
                            </span>

                            <span id="archiver" class="h-10 w-10 border rounded-full border-[#716c5b] flex justify-center items-center">
                                <i class='bx  bxs-archive-alt text-xl text-black'></i>
                            </span>

                            <span class="h-10 w-10 border rounded-full border-[#837d73] flex justify-center items-center">
                                <i class="bx bxs-box font-bold text-xl text-[#837d73]"></i>
                            </span>

                            <span class="h-10 w-10 border rounded-full border-[#9f070e] flex justify-center items-center">
                                <i class="bx bxs-trash-alt font-bold text-xl text-[#9f070e]"></i>
                            </span>

                        </div>
                    </div>
                </div>
            </div>

            <div id="zoneMessage" class="flex flex-col w-full h-[88%] ">
                <div id="expediteur" class="flex flex-col justify-end items-end w-[98%] h-max ">
                    <!-- <span id="messageEnvoyer" class=" flex flex-row justify-end items-end  w-max  rounded-xl rounded-l-xl  m-3 p-3 h-min text-white bg-green-600 ">hello world</span> -->

                </div>

                <div id="recepteur" class="flex flex-row justify-start items-start w-[98%] h-max ">
                    <span id="messageRecu" class=" flex flex-row justify-start items-start  w-max  rounded-xl rounded-l-xl  m-3 p-3 h-min text-black bg-gray-100 ">hello world</span>
                </div>
            </div>

            <div class="flex flex-row w-full  h-[7%] bg-white py-1 px-5">
                <div class="w-[94%] h-[40px] my-1 ">
                    <input type="text" name="" id="textMessage" placeholder="Ecrire" class=" bg-gray-100 h-full  w-full pl-4 py-2 text-l border-2 rounded-2xl">
                </div>

                <div id="btnEnvoie" class=" flex flex-row justify-center items-center w-[5%] ml-[5px] rounded-full bg-green-600 text-white text-2xl">
                    <i class='bx bxs-arrow-right-stroke'></i>
                </div>
            </div>

        </div>

    </div>
    <script type="module" src="/src/controller/controller.js"></script>
</body>

</html>
